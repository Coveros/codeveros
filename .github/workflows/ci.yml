# Runs on pull requests to main when there are changes to the service files in services/
# Lints and Unit tests the services that have changed

name: Service CI

permissions:
  contents: read
  packages: write
  id-token: write

on:
  pull_request:
    branches: [main]
    paths: ["services/**"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["services/**"]

env:
  NODE_VERSION: 22.x
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix-include: ${{ steps.set-matrix.outputs.filtered }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/filters.yml
      - name: Filter service values based on code changes
        id: set-matrix
        uses: './.github/actions/filter-options'
        with:
          options: .github/service-values.yml
          options-to-select: ${{ steps.filter.outputs.changes }}

  lint-and-test:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix-include) }}
    defaults:
      run:
        working-directory: ${{ matrix.context }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.context }}/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci --quiet

      - name: Lint Code
        run: npm run checkstyle:ci

      - name: Unit Test
        run: npm run test-ci

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=pr

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.3'

      - name: Check install
        run: cosign version

      - name: Setup Fianu
        uses: fianulabs/actions@main
        with:
          version: 1.9.67

#      - name: Initialize TUF
#        env:
#          FIANU_HOST: app.fianu.io
#          FIANU_CLIENT_ID: ${{ secrets.FIANU_CLIENT_ID }}
#          FIANU_CLIENT_SECRET: ${{ secrets.FIANU_CLIENT_SECRET }}
#        run: |-
#          fianu root init
#          curl -sSf "https://app.fianu.io/ledger/root/targets/trusted_root.json" -o trusted_root.json

      - name: Initialize Cosign
        run: |
          cosign initialize \
          --mirror "https://app.fianu.io/ledger/root" \
          --root "https://app.fianu.io/ledger/root/root.json"

      - name: Signing Config
        run: |
          cosign signing-config create \
            --fulcio="url=https://app.fianu.io/ledger/fulcio,api-version=1,start-time=2020-01-01T00:00:00Z,operator=fianu" \
            --rekor="url=https://rekor-tiles.prod.fianu.io,api-version=2,start-time=2020-01-01T00:00:00Z,operator=fianu" \
            --rekor-config="ANY" \
            --tsa="url=https://app.fianu.io/ledger/timestamp,api-version=1,start-time=2020-01-01T00:00:00Z,operator=fianu" \
            --tsa-config="ANY" \
            --output-file signing_config.json

#      - name: Output Trusted Root
#        run: cat trusted_root.json

      - name: Output the Config
        run: cat signing_config.json

      - name: Sign Image
        run: |
          cosign sign \
          -a commit=${{ github.sha }} \
          --signing-config=signing_config.json \
          --yes \
          "${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Verify Signature
        run: |
          cosign verify \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          --certificate-identity-regexp="^https://github\.com/Coveros/.*$" \
          "${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
